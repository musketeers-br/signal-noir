# Negative case (generated by generate_cases.py): ReviewRequired → Cancelled performed by system
version: 1.0.0
supersedes:
- prd-signal-noir/addendum.md §D
- architecture-signal-noir.md AD-24 (Pontos fixados)
parameters:
  approvalTtl: PT15M
  reassessInterval: PT60S
  maxInconclusiveReconciliations: 3
  maxDenials: 2
states:
- name: Open
  class: active
  transient: true
  restart: redispatch
- name: Investigating
  class: active
  transient: false
  restart: sweeperReview
- name: DecisionProposed
  class: active
  transient: true
  restart: redispatch
- name: PendingApproval
  class: active
  transient: false
  restart: keep
- name: Approved
  class: active
  transient: true
  restart: redispatch
- name: Rejected
  class: active
  transient: true
  restart: redispatch
- name: Executing
  class: active
  transient: false
  restart: sweeperReconcile
- name: Held
  class: waiting
  transient: false
  restart: keep
- name: ReviewRequired
  class: waiting
  transient: false
  restart: keep
- name: Resolved
  class: terminal
  transient: false
  restart: keep
- name: ResolvedByPriorReceipt
  class: terminal
  transient: false
  restart: keep
- name: Cancelled
  class: terminal
  transient: false
  restart: keep
- name: Failed
  class: terminal
  transient: false
  restart: keep
transitions:
- id: T01
  from: null
  to: Open
  trigger: 1st Exception for an orderId
  command: null
  actors:
  - system
  preconditions:
  - check: orderSnapshotRecorded
    expected: true
  - check: noOpenCaseForOrder
    expected: true
  - check: previousCaseExists
    expected: false
  events:
  - CaseOpened
  - ExceptionRecorded
  followUp:
    outbox:
    - Investigate
    inProcess: null
    dossier: false
    terminal: false
- id: T02
  from: null
  to: Open
  trigger: Exception for an orderId whose most recent Case is terminal, or Exception attached during the Execution
    of a Case that ends in Failed (T25)
  command: null
  actors:
  - system
  preconditions:
  - check: noOpenCaseForOrder
    expected: true
  - check: previousCaseTerminal
    expected: true
  events:
  - CaseOpened
  - ExceptionRecorded
  - Annotation
  effectsOnRecords:
  - new Case records previousEpisodeCaseId
  - previous Case gains Annotation kind=new_episode_opened (attachment, no transition)
  followUp:
    outbox:
    - Investigate
    inProcess: null
    dossier: false
    terminal: false
  decision: D2
  pendingContractChange: '2.5'
  contractChanges:
  - C1
  - C3
- id: T03
  from: Open
  to: Investigating
  trigger: Investigate command
  command: Investigate
  actors:
  - system
  preconditions:
  - check: state
    expected: Open
  - check: caseVersionMatches
    expected: true
  events: []
  effectsOnRecords:
  - records stepLeaseUntil
  followUp:
    outbox: []
    inProcess: 'Investigation: Tools port (ToolCalled by attachment) and the proposer of the Case''s mode'
    dossier: false
    terminal: false
- id: T04
  from: Investigating
  to: DecisionProposed
  trigger: Proposer returns a valid Proposal within budget
  command: null
  actors:
  - agent
  - rules
  - replay
  preconditions:
  - check: state
    expected: Investigating
  - check: leaseValid
    expected: true
  - check: proposerMatchesMode
    expected: true
  - check: proposalDtoValid
    expected: true
  - check: claimsCiteEvidence
    expected: true
  events:
  - ProposalCreated
  effectsOnRecords:
  - previous Proposal, if any, stops being current
  followUp:
    outbox: []
    inProcess: Validator in the same step (T07 to T10)
    dossier: false
    terminal: false
- id: T05
  from: Investigating
  to: ReviewRequired
  trigger: Budget exceeded, invalid response, Agent refusal or Provider unavailable (FR-4)
  command: null
  actors:
  - system
  preconditions:
  - check: state
    expected: Investigating
  - check: leaseValid
    expected: true
  - check: investigationFailure
    expected:
    - budget_exceeded
    - invalid_agent_response
    - agent_refusal
    - provider_unavailable
  events:
  - DossierCreated
  effectsOnRecords:
  - Dossier with the Evidence collected so far
  followUp:
    outbox: []
    inProcess: null
    dossier: true
    terminal: false
- id: T06
  from: Investigating
  to: ReviewRequired
  trigger: Investigation interrupted (restart or lost work)
  command: null
  actors:
  - sweeper
  preconditions:
  - check: state
    expected: Investigating
  - check: leaseExpired
    expected: true
  events:
  - DossierCreated
  effectsOnRecords:
  - Dossier reason=investigation_interrupted
  - a late proposer answer will be discarded (CommandDiscarded)
  followUp:
    outbox: []
    inProcess: null
    dossier: true
    terminal: false
- id: T07
  from: DecisionProposed
  to: PendingApproval
  trigger: Verdict accepted with requiresApproval = true
  command: null
  actors:
  - system
  preconditions:
  - check: proposalIsCurrent
    expected: true
  - check: verdict
    expected: accepted
  - check: requiresApproval
    expected: true
  events:
  - ValidatorVerdict
  followUp:
    outbox: []
    inProcess: 'Outside a BenchmarkRun: human wait. In a BenchmarkRun: T12. In the Operator resolution: T11'
    dossier: false
    terminal: false
  sameStepAs:
  - T11
  - T12
- id: T08
  from: DecisionProposed
  to: Executing
  trigger: Verdict accepted with requiresApproval = false (HOLD only)
  command: null
  actors:
  - system
  preconditions:
  - check: action
    expected: HOLD
  - check: verdict
    expected: accepted
  - check: requiresApproval
    expected: false
  - check: noExecutionInFlight
    expected: true
  events:
  - ValidatorVerdict
  - ExecutionAuthorized
  followUp:
    outbox:
    - Execute
    inProcess: null
    dossier: false
    terminal: false
- id: T09
  from: DecisionProposed
  to: ResolvedByPriorReceipt
  trigger: Verdict prior_receipt_confirmed (FR-47)
  command: null
  actors:
  - system
  preconditions:
  - check: verdict
    expected: prior_receipt_confirmed
  - check: priorReceiptEvidenceRecorded
    expected: true
  - check: equivalenceKeysEqual
    expected: true
  events:
  - ValidatorVerdict
  - ReceiptRecorded
  effectsOnRecords:
  - link to the prior Receipt; no Execution
  followUp:
    outbox: []
    inProcess: null
    dossier: false
    terminal: true
- id: T10
  from: DecisionProposed
  to: ReviewRequired
  trigger: Verdict blocked or review
  command: null
  actors:
  - system
  preconditions:
  - check: proposalIsCurrent
    expected: true
  - check: verdict
    expected:
    - blocked
    - review
  events:
  - ValidatorVerdict
  - DossierCreated
  effectsOnRecords:
  - Dossier reason ∈ validator_blocked, missing_evidence, low_confidence, prior_receipt_unconfirmed (with the candidate),
    ambiguous_identity, review_requested
  followUp:
    outbox: []
    inProcess: null
    dossier: true
    terminal: false
- id: T11
  from: PendingApproval
  to: Approved
  trigger: Operator approves
  command: decideProposal
  actors:
  - operator:*
  preconditions:
  - check: state
    expected: PendingApproval
  - check: proposalIsCurrent
    expected: true
  - check: caseVersionMatches
    expected: true
  - check: decision
    expected: approved
  events:
  - ApprovalRecorded
  effectsOnRecords:
  - Approval decision=approved, expiresAt = now + approvalTtl
  followUp:
    outbox:
    - Execute
    inProcess: null
    dossier: false
    terminal: false
- id: T12
  from: PendingApproval
  to: Approved
  trigger: Benchmark Automatic Approval
  command: null
  actors:
  - benchmark
  preconditions:
  - check: benchmarkRun
    expected: true
  - check: sameStepAsValidation
    expected: true
  events:
  - ApprovalRecorded
  effectsOnRecords:
  - Approval by=benchmark, expiresAt = now + approvalTtl
  followUp:
    outbox:
    - Execute
    inProcess: null
    dossier: false
    terminal: false
- id: T13
  from: PendingApproval
  to: Rejected
  trigger: Operator denies with a reason
  command: decideProposal
  actors:
  - operator:*
  preconditions:
  - check: state
    expected: PendingApproval
  - check: proposalIsCurrent
    expected: true
  - check: caseVersionMatches
    expected: true
  - check: decision
    expected: denied
  - check: reasonPresent
    expected: true
  - check: denialCountBelow
    expected: maxDenials
  events:
  - ApprovalRecorded
  effectsOnRecords:
  - increments denialCount
  - reason recorded as Evidence operator.denial_reason
  followUp:
    outbox:
    - Investigate
    inProcess: null
    dossier: false
    terminal: false
- id: T14
  from: Rejected
  to: Investigating
  trigger: Investigate command with denialCount = 1
  command: Investigate
  actors:
  - system
  preconditions:
  - check: state
    expected: Rejected
  - check: caseVersionMatches
    expected: true
  - check: denialCount
    expected: 1
  events: []
  effectsOnRecords:
  - records stepLeaseUntil
  - the denial Evidence enters the base package
  followUp:
    outbox: []
    inProcess: Investigation, as in T03
    dossier: false
    terminal: false
- id: T15
  from: Rejected
  to: ReviewRequired
  trigger: Investigate command with denialCount = maxDenials
  command: Investigate
  actors:
  - system
  preconditions:
  - check: state
    expected: Rejected
  - check: caseVersionMatches
    expected: true
  - check: denialCount
    expected: maxDenials
  events:
  - DossierCreated
  effectsOnRecords:
  - Dossier reason=second_denial
  followUp:
    outbox: []
    inProcess: null
    dossier: true
    terminal: false
- id: T16
  from: PendingApproval
  to: Investigating
  trigger: New Exception for the same Order (D1)
  command: null
  actors:
  - system
  preconditions:
  - check: state
    expected: PendingApproval
  - check: newException
    expected: true
  events:
  - ExceptionRecorded
  effectsOnRecords:
  - current Proposal stops being current; open screens receive STALE_VERSION
  - records stepLeaseUntil
  followUp:
    outbox:
    - Investigate
    inProcess: null
    dossier: false
    terminal: false
  decision: D1
- id: T17
  from: Approved
  to: Executing
  trigger: 'Execute command: authorization CAS'
  command: Execute
  actors:
  - system
  preconditions:
  - check: state
    expected: Approved
  - check: caseVersionMatches
    expected: true
  - check: approvalForCurrentProposal
    expected: true
  - check: approvalNotExpired
    expected: true
  - check: noExecutionInFlight
    expected: true
  events:
  - ExecutionAuthorized
  effectsOnRecords:
  - creates the Execution with executionId, effect key and lease
  - 'expired Approval: command refused (APPROVAL_EXPIRED), the Case stays in Approved until T18'
  followUp:
    outbox: []
    inProcess: Revalidation, prior Reconciliation by orderId, send (AD-5)
    dossier: false
    terminal: false
  decision: D3
- id: T18
  from: Approved
  to: PendingApproval
  trigger: Expire command (FR-18)
  command: Expire
  actors:
  - sweeper
  preconditions:
  - check: state
    expected: Approved
  - check: approvalExpired
    expected: true
  - check: noAuthorization
    expected: true
  events:
  - ApprovalExpired
  effectsOnRecords:
  - Proposal stays current and needs a new Approval
  followUp:
    outbox: []
    inProcess: null
    dossier: false
    terminal: false
  decision: D3
- id: T19
  from: Executing
  to: Held
  trigger: 'Revalidation: PARTNER_HEALTHY_WINDOW false'
  command: null
  actors:
  - system
  preconditions:
  - check: executionOutcome
    expected: in_progress
  - check: noAttemptSent
    expected: true
  - check: revalidationFailed
    expected: PARTNER_HEALTHY_WINDOW
  events:
  - RevalidationPerformed
  effectsOnRecords:
  - Execution closes with outcome=held
  - authorization voided in the same transaction
  followUp:
    outbox: []
    inProcess: the sweeper issues Reassess every reassessInterval
    dossier: false
    terminal: false
  decision: D3
- id: T20
  from: Executing
  to: Held
  trigger: Execution of HOLD
  command: Execute
  actors:
  - system
  preconditions:
  - check: action
    expected: HOLD
  events:
  - RevalidationPerformed
  effectsOnRecords:
  - Execution closes with outcome=held
  followUp:
    outbox: []
    inProcess: the sweeper issues Reassess every reassessInterval
    dossier: false
    terminal: false
- id: T21
  from: Executing
  to: Cancelled
  trigger: 'Revalidation: ORDER_ACTIVE_AT_ORIGIN false'
  command: null
  actors:
  - system
  preconditions:
  - check: executionOutcome
    expected: in_progress
  - check: noAttemptSent
    expected: true
  - check: revalidationFailed
    expected: ORDER_ACTIVE_AT_ORIGIN
  events:
  - RevalidationPerformed
  effectsOnRecords:
  - Execution closes with outcome=cancelled
  - authorization voided in the same transaction
  followUp:
    outbox: []
    inProcess: null
    dossier: false
    terminal: true
  decision: D3
- id: T22
  from: Executing
  to: Investigating
  trigger: 'Revalidation: POLICY_VERSION_UNCHANGED or MAPPING_VERSION_UNCHANGED false'
  command: null
  actors:
  - system
  preconditions:
  - check: executionOutcome
    expected: in_progress
  - check: noAttemptSent
    expected: true
  - check: revalidationFailed
    expected:
    - POLICY_VERSION_UNCHANGED
    - MAPPING_VERSION_UNCHANGED
  events:
  - RevalidationPerformed
  effectsOnRecords:
  - Execution closes with outcome=cancelled
  - authorization voided in the same transaction
  - Proposal stops being current
  - records stepLeaseUntil
  - denialCount is not reset (FR-006)
  followUp:
    outbox:
    - Investigate
    inProcess: null
    dossier: false
    terminal: false
  decision: D3
- id: T23
  from: Executing
  to: Resolved
  trigger: Partner response classified success with a valid Receipt
  command: null
  actors:
  - system
  preconditions:
  - check: responseClass
    expected: success
  - check: receiptMatches
    expected: true
  events:
  - AttemptRecorded
  - ReceiptRecorded
  effectsOnRecords:
  - Execution closes with outcome=resolved
  - Exceptions attached during the Execution stay recorded only
  followUp:
    outbox: []
    inProcess: null
    dossier: false
    terminal: true
- id: T24
  from: Executing
  to: Resolved
  trigger: Prior Reconciliation or Reconciliation finds a Receipt (FR-23)
  command: Reconcile
  actors:
  - system
  preconditions:
  - check: reconciliationResult
    expected: receipt_found
  - check: receiptMatches
    expected: true
  events:
  - ReconciliationPerformed
  - ReceiptRecorded
  effectsOnRecords:
  - Execution closes with outcome=resolved; no resend
  followUp:
    outbox: []
    inProcess: null
    dossier: false
    terminal: true
  decision: D4
- id: T25
  from: Executing
  to: Failed
  trigger: Policy Attempts exhausted
  command: null
  actors:
  - system
  preconditions:
  - check: attemptsExhausted
    expected: true
  - check: noUncertainAttemptPending
    expected: true
  events:
  - AttemptRecorded
  effectsOnRecords:
  - Execution closes with outcome=failed
  - 'with pendingReassessmentExceptions: opens a new episode (T02) in the same transaction'
  followUp:
    outbox: []
    inProcess: null
    dossier: false
    terminal: true
  sameStepAs:
  - T02
  decision: D2
- id: T26
  from: Executing
  to: ReviewRequired
  trigger: Reconciliation inconclusive after the round limit (D4)
  command: Reconcile
  actors:
  - system
  preconditions:
  - check: executionOutcome
    expected: reconciling
  - check: inconclusiveReconciliations
    expected: maxInconclusiveReconciliations
  events:
  - ReconciliationPerformed
  - DossierCreated
  effectsOnRecords:
  - Execution stays reconciling
  - Dossier reason=outcome_unknown
  - new sends for the Order blocked until a conclusive Reconciliation
  followUp:
    outbox: []
    inProcess: null
    dossier: true
    terminal: false
  decision: D4
  pendingContractChange: '2.5'
  contractChanges:
  - C2
  - C5
- id: T27
  from: Held
  to: Investigating
  trigger: Reassess command finds that the waiting condition is over (FR-51)
  command: Reassess
  actors:
  - system
  preconditions:
  - check: state
    expected: Held
  - check: waitConditionEnded
    expected: true
  events:
  - ReassessmentPerformed
  effectsOnRecords:
  - the previous Approval is never reused (AD-7)
  - records stepLeaseUntil
  - denialCount is not reset (FR-006)
  followUp:
    outbox:
    - Investigate
    inProcess: null
    dossier: false
    terminal: false
- id: T28
  from: ReviewRequired
  to: DecisionProposed
  trigger: Operator resolution with a Catalog Action (FR-29)
  command: resolveReview
  actors:
  - operator:*
  preconditions:
  - check: state
    expected: ReviewRequired
  - check: caseVersionMatches
    expected: true
  - check: resolutionAction
    expected:
    - RETRY
    - APPLY_APPROVED_MAPPING
    - HOLD
  - check: verdict
    expected: accepted
  events:
  - OperatorResolution
  - ProposalCreated
  effectsOnRecords:
  - Proposal authored by operator:<name>
  - 'Validator refuses: nothing but ValidatorVerdict is recorded and the Case stays in ReviewRequired'
  followUp:
    outbox: []
    inProcess: T07 followed by T11 with the same Operator, or T08 for HOLD
    dossier: false
    terminal: false
  sameStepAs:
  - T07
  - T11
  - T08
- id: T29
  from: ReviewRequired
  to: Cancelled
  trigger: Operator resolution by cancellation
  command: resolveReview
  actors:
  - system
  preconditions:
  - check: state
    expected: ReviewRequired
  - check: caseVersionMatches
    expected: true
  - check: reasonPresent
    expected: true
  events:
  - OperatorResolution
  followUp:
    outbox: []
    inProcess: null
    dossier: false
    terminal: true
attachments:
- event: ExceptionRecorded
  states:
  - Open
  - Investigating
  - DecisionProposed
  - Rejected
  - Approved
  - Executing
  - Held
  - ReviewRequired
  actors:
  - system
  note: 'New Exception for the same Order (D1). In PendingApproval it is a transition (T16); in a terminal state
    it is a new episode (T02). In Investigating it does not restart the Investigation: it enters as Evidence if
    collection is still open. In Approved/Executing it stays in pendingReassessmentExceptions until T23 or T25.
    In Held it does not bring the Reassessment forward. In ReviewRequired it updates the Dossier'
- event: ToolCalled
  states:
  - Investigating
  - Held
  actors:
  - system
  - agent
  - rules
  - replay
  note: Every call through the Tools port, including during the Reassessment of Held
- event: EvidenceObsoleted
  states:
  - Investigating
  - Held
  actors:
  - system
  - agent
  - rules
  - replay
  note: Obsolete Evidence is marked by a new event, never altered
- event: ValidatorVerdict
  states:
  - ReviewRequired
  actors:
  - system
  note: 'Operator resolution refused by the Validator (UJ-4 step 2): only the verdict, no transition'
- event: ReassessmentPerformed
  states:
  - Held
  actors:
  - system
  note: The waiting condition still holds
- event: Annotation
  states:
  - '*'
  actors:
  - system
  - operator:*
  kinds:
  - receipt_corrected
  - receipt_missing
  - new_episode_opened
  - note
  terminalKinds:
  - receipt_corrected
  - receipt_missing
  - new_episode_opened
  note: receipt_corrected and receipt_missing (D5; the Partner prevails; receipt_missing alerts the Operator); new_episode_opened
    on the previous Case (T02)
  pendingContractChange: '2.5'
  contractChanges:
  - C3
- event: CommandDiscarded
  states:
  - '*'
  actors:
  - (actor of the refused command)
  note: Record of every refusal (see refusals), including in a terminal state; payload {command, actor, currentState,
    requestedState, code}
  pendingContractChange: '2.5'
  contractChanges:
  - C4
- event: RevalidationPerformed
  states:
  - Executing
  actors:
  - system
  note: Passed Revalidation, before the send
- event: AttemptRecorded
  states:
  - Executing
  actors:
  - system
  note: Policy Attempts belong to the Execution, never an Exception of the Case
- event: ReconciliationPerformed
  states:
  - Executing
  - ReviewRequired
  actors:
  - system
  note: In ReviewRequired (Execution still reconciling, T26), a conclusive Reconciliation closes the Execution and
    updates the Dossier, without a transition (D4)
refusals:
- code: INVALID_TRANSITION
  when: (current state, requested state) pair outside transitions, e.g. Open → Executing; or a false precondition
    with no code of its own
  records: CommandDiscarded
  httpStatus: 409
  changesState: false
- code: INVALID_ACTOR
  when: The transition exists, but the command's actor is not in actors (includes benchmark outside a BenchmarkRun
    and a proposer different from the Case's mode)
  records: CommandDiscarded
  httpStatus: 403
  changesState: false
- code: STALE_VERSION
  when: expectedCaseVersion, expected state or target (proposalId, executionId) differs from the Case; except a
    repeated Approval (FR-014), which answers idempotently
  records: CommandDiscarded
  httpStatus: 409
  changesState: false
- code: APPROVAL_EXPIRED
  when: Authorization CAS (T17) with the Approval expired; the Case stays in Approved until the sweeper applies
    T18
  records: CommandDiscarded
  httpStatus: null
  changesState: false
decisions:
- id: D1
  contradiction: 1
  replaces: 'addendum §D: any non-terminal → Investigating on a new Exception'
  rule: A new Exception for the same Order is a transition only in PendingApproval (T16); in the other non-terminal
    states it is an attachment. In Approved/Executing it is reassessed at the end of the Execution (T23 records
    it; T25 opens a new episode).
  reason: No Exception pulls a Case out of an Execution in flight or out of a wait with a defined owner.
  exceptionTriggersOnlyFrom:
  - PendingApproval
  forbids: []
- id: D2
  contradiction: 2
  replaces: 'AD-24: Failed → Investigating'
  rule: Failed stays terminal. With an Exception attached during Approved/Executing, T25 opens in the same transaction
    a new related Case (T02).
  reason: Terminal never reopens (Principle V), without losing the reassessment AD-24 wanted.
  forbids:
  - - Failed
    - Investigating
- id: D3
  contradiction: 3
  replaces: 'addendum §D: Approved → Held, Approved → Cancelled, Approved → PendingApproval by Evidence, Investigating
    → ResolvedByPriorReceipt'
  rule: The AD-5 order is kept (authorization CAS, then Revalidation). Failure leads to Executing → Held (T19),
    Cancelled (T21) or Investigating (T22), with precedence Cancelled > Investigating > Held, no Attempt sent and
    the authorization voided in the same transaction. Approval validity is checked at the CAS (T17); Approved →
    PendingApproval happens only by expiration (T18). Every closure by a prior Receipt goes through the Validator
    (T09).
  reason: A single owner for expiration and a single moment for checking preconditions.
  forbids:
  - - Approved
    - Held
  - - Approved
    - Cancelled
  - - Executing
    - PendingApproval
  - - Investigating
    - ResolvedByPriorReceipt
- id: D4
  contradiction: 4
  replaces: case.executing.outcome-unknown has no exit when Reconciliation finds no Receipt
  rule: Receipt found → T24. Conclusive absence → new Attempt with the same effect key or, with no Attempts left,
    T25. Inconclusive for maxInconclusiveReconciliations rounds → T26 (outcome_unknown). With an Execution in reconciling,
    no new send for the Order.
  reason: Uncertainty distinct from failure and from waiting (Principle VII); uncertainty blocks effects (Principle
    VI).
  forbids: []
- id: D5
  contradiction: 5
  replaces: 'AD-14 / review M-7: Receipt correction on a terminal Case by command'
  rule: Correcting the Receipt copy on a terminal Case is an Annotation receipt_corrected; a missing canonical Receipt
    is an Annotation receipt_missing with an alert. Neither changes state or caseVersion or opens a new Case.
